<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
.gallery {
    columns: 4;
    column-gap: 8px;
    padding: 8px;
}

.gallery img {
    width: 100%;
    margin-bottom: 8px;
    display: block;
    break-inside: avoid;
    image-rendering: pixelated;
}

.gallery img:hover{
    transform: scale(2);
    transition: transform .2s;
}

    </style>
</head>
<body>
<h1>collection of overwatch ui textures</h1>
<p>may be duplicates</p>

<div class="gallery" id="gallery"></div>

<script>
async function loadGallery() {
    const response = await fetch(
        'https://api.github.com/repos/popa39/overwatch/contents/selected'
    );

    const files = await response.json();
    const gallery = document.getElementById('gallery');

    files
        .filter(file => file.name.toLowerCase().endsWith('.png'))
        .forEach(file => {
            const img = document.createElement('img');

            img.src = 'https://gh-proxy.com/' + file.download_url;
            img.alt = file.name;
            img.loading = 'lazy';

            gallery.appendChild(img);
        });
}

loadGallery();
</script>
</body>
</html>
